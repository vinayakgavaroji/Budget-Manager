<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#254d3a" />
      <stop offset="100%" stop-color="#12271d" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8ebd5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Icon Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#4d7752" stroke-width="12" stroke-opacity="0.6" />

  <!-- Upward Trend Line Badge Accent -->
  <g fill="none" stroke="#10b981" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 110 370 L 210 270 L 290 320 L 390 190" />
    <path d="M 310 190 L 390 190 L 390 270" />
  </g>

  <!-- Main Rupee Currency Symbol -->
  <text x="180" y="350" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="240" fill="url(#symbolGrad)" filter="url(#shadow)">₹</text>
</svg>
